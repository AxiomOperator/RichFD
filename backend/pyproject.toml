[project]
name = "richrule"
version = "0.1.0"
description = "Web manager for firewalld zones and rich rules"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-pam>=2.0",
  "itsdangerous>=2.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]
# firewall and dbus come from the system packages (python3-firewall, python3-dbus);
# create the venv with --system-site-packages.

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]
