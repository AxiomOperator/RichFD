# nginx in front of richrule. richrule keeps listening on 127.0.0.1:8443;
# set RICHRULE_SECURE_COOKIES=1 in /etc/richrule/richrule.env.
server {
    listen 443 ssl;
    http2 on;
    server_name firewall.example.com;

    ssl_certificate     /etc/pki/tls/certs/firewall.example.com.crt;
    ssl_certificate_key /etc/pki/tls/private/firewall.example.com.key;

    client_max_body_size 20m;   # config imports

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Server-sent events for the live packet log: no buffering, long reads.
    location /api/denied/stream {
        proxy_pass http://127.0.0.1:8443;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location ~ ^/api/h/[^/]+/denied/stream$ {
        proxy_pass http://127.0.0.1:8443;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
